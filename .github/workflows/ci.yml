name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  ci-precheck:
    name: CI Precheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate referenced paths exist
        run: |
          bash scripts/ci-precheck.sh

  # Go Tests
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: [ci-precheck]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
            
      - name: Download dependencies
        run: cd go && go mod download
        
      - name: Run tests
        run: make go-test
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./go/coverage.out
          flags: go

  # Python Tests
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [ci-precheck]
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          cd python
          pip install -e ".[dev,cli]"
          
      - name: Run tests
        run: |
          make python-test
          cd python && PYTHONHASHSEED=0 pytest tests/ -q --cov=truenas_storage_monitor --cov-report=xml --cov-fail-under=70
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./python/coverage.xml
          flags: python

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [ci-precheck]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        # Dependabot/fork PRs run with a read-only token and cannot upload SARIF;
        # keep the job green there while still uploading on push to protected branches.
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          
      - name: Set up Python for security scan
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install Python security tools
        run: |
          pip install bandit safety
          
      - name: Run Bandit security scan
        run: |
          cd python
          bandit -r truenas_storage_monitor/ -lll -f json -o bandit-report.json
          
      - name: Run Safety check
        run: |
          cd python
          safety check -r requirements.txt -r requirements-dev.txt -r requirements-cli.txt --output json > safety-report.json

      - name: Upload security artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-reports
          path: |
            trivy-results.sarif
            python/bandit-report.json
            python/safety-report.json

  # Linting
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [ci-precheck]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          working-directory: go
          args: --timeout=5m
          
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install Python linting tools
        run: |
          pip install black flake8 mypy
          
      - name: Run Black
        run: make python-lint

  # Build Test
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [go-tests, python-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          
      - name: Build Go binaries
        run: |
          cd go
          go build -o ../bin/monitor ./cmd/monitor
          go build -o ../bin/api-server ./cmd/api-server
          
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Build Python package
        run: |
          cd python
          pip install build
          python -m build
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: |
            bin/
            python/dist/

  # Container Build Test
  container-build:
    name: Container Build Test
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build monitor container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.monitor
          push: false
          tags: truenas-monitor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build API container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.api
          push: false
          tags: truenas-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build CLI container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.cli
          push: false
          tags: truenas-cli:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Branch protection requires a check named "CI Pipeline" (workflow name alone is not reported).
  ci-pipeline:
    name: CI Pipeline
    runs-on: ubuntu-latest
    needs:
      - ci-precheck
      - go-tests
      - python-tests
      - security-scan
      - lint
      - container-build
    if: always()
    steps:
      - name: Require all CI jobs to succeed
        env:
          CI_PRECHECK: ${{ needs.ci-precheck.result }}
          GO_TESTS: ${{ needs.go-tests.result }}
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          LINT: ${{ needs.lint.result }}
          CONTAINER_BUILD: ${{ needs.container-build.result }}
        run: |
          check() {
            if [ "$2" != "success" ]; then
              echo "Job $1 finished with result: $2"
              exit 1
            fi
          }
          check ci-precheck "$CI_PRECHECK"
          check go-tests "$GO_TESTS"
          check python-tests "$PYTHON_TESTS"
          check security-scan "$SECURITY_SCAN"
          check lint "$LINT"
          check container-build "$CONTAINER_BUILD"
          echo "All CI jobs passed."